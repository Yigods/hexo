name: Build and verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify committed theme assets
        run: git diff --exit-code -- themes/redefine/source/css/build themes/redefine/source/js/build
